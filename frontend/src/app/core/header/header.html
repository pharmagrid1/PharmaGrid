<header class="navbar">
  <div class="nav-brand" routerLink="/">
    <span class="brand-icon">✦</span>
    <span class="brand-name">PharmaGrid</span>
  </div>

  <div class="nav-search">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    />
    <button class="search-btn" (click)="onSearch()">🔍</button>
  </div>

  <nav class="nav-links" [class.open]="menuOpen">
    <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a>
    <a routerLink="/my-orders" routerLinkActive="active" (click)="closeMenu()">My Orders</a>

    @if(isLoggedIn){
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">👤 {{userName}}</a>
      <button class="logout-btn" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
    }

    <a routerLink="/cart" class="cart-btn" (click)="closeMenu()">Cart</a>

    @if(isLoggedIn && isAdmin) {
      <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a>
    }
  </nav>

  <button class="menu-toggle" (click)="toggleMenu()">
    {{ menuOpen ? '✕' : '☰' }}
  </button>
</header>
