<mat-card class="product-card mat-elevation-z1">
  <img mat-card-image [src]="image" (error)="onImageError($event)" />
  <mat-card-content>
    <p class="brand">{{brand}}</p>
    <h3 class="name">{{name}}</h3>
    <mat-chip color="tertiary" selected>{{skinType}}</mat-chip>
    <p class="price">€{{price}}</p>
    <div class="card-stars">
      @for(star of getStars(rating); track $index){
        <span [class.filled]="star === 'full'" [class.half]="star === 'half'">
          {{ star === 'empty' ? '☆' : '★' }}
        </span>
      }
    </div>
    <span class="stock-badge"
      [class.in-stock]="stock > 10"
      [class.low-stock]="stock > 0 && stock <= 10"
      [class.out-of-stock]="stock === 0">
      {{ stock > 10 ? 'In Stock' : stock > 0 ? 'Low Stock' : 'Out of Stock' }}
    </span>
  </mat-card-content>
  <mat-card-actions>
    <button mat-stroked-button color="primary" [routerLink]="['/product', id]">
      View Details
    </button>
    <button mat-flat-button color="primary" (click)="addToCart()">
      Add to Cart
    </button>
  </mat-card-actions>
</mat-card>
